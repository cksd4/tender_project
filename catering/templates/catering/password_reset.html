{% extends 'catering/base.html' %}
{% block content %}
<div style="max-width: 450px; margin: 3rem auto;" class="ui-card">
    <h1 style="color: var(--brand-primary); margin-top: 0;">Reset Your Password</h1>
    <p>Provide your registered email address beneath. If an account is linked to it, we will transmit a secure reset link instantly.</p>

    <form method="post" novalidate>
        {% csrf_token %}
        <p>
            <label for="id_email">Registered Email Address</label>
            <input type="email" name="email" autocomplete="email" required id="id_email">
        </p>
        <button type="submit" class="ui-btn" style="width: 100%; margin-top: 0.5rem;">Transmit Reset Link</button>
    </form>
</div>
{% endblock %}
