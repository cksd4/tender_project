{% extends 'catering/base.html' %}

{% block content %}
<div class="card auth-card login-card">
    <h1 class="auth-title">Sign In</h1>
    <p>Provide your credentials to access your `tender_project` corporate dashboard.</p>

    <!-- Secure submission form executing authentication protocols (3.1) -->
    <form method="post" novalidate class="auth-form login-form">
        {% csrf_token %}
        
        <!-- Non-field error banner layout (e.g., incorrect password alerts) -->
        {% if form.non_field_errors %}
            <div role="alert" class="login-error">
                {{ form.non_field_errors|striptags }}
            </div>
        {% endif %}

        <div class="form-field login-field">
            <label id="username-label" for="id_username">Username</label>
            <input type="text" name="username" autofocus required id="id_username" autocomplete="username">
        </div>

        <div class="form-field login-field">
            <label id="password-label" for="id_password">Password</label>
            <input type="password" name="password" required id="id_password" autocomplete="current-password">
        </div>

        <button type="submit" class="btn auth-submit login-submit">
            Secure Log In
        </button>
    </form>

    <p class="auth-footer">
        New to the network? <a href="{% url 'register' %}" class="auth-link">Create an account</a>
    </p>
</div>
{% endblock %}
