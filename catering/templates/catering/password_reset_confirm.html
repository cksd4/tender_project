{% extends 'catering/base.html' %}
block content
<div class="ui-card auth-panel">
    <h1>Choose a New Password</h1>
    <p>Please enter your chosen secure credentials twice below to update your network profile authentication token.</p>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="ui-btn ui-btn-success action-full action-top-medium">Save & Finalize Password</button>
    </form>
</div>
{% endblock %}
