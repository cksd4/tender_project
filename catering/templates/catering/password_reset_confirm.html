{% extends 'catering/base.html' %}
block content
<div style="max-width: 450px; margin: 3rem auto;" class="ui-card">
    <h1>Choose a New Password</h1>
    <p>Please enter your chosen secure credentials twice below to update your network profile authentication token.</p>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="ui-btn ui-btn-success" style="width: 100%; margin-top: 1rem;">Save & Finalize Password</button>
    </form>
</div>
{% endblock %}
