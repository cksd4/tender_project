{% extends 'catering/base.html' %}
{% block content %}
<div class="ui-card edit-meal-card">
    <h1>Modify Menu Option</h1>
    <p class="muted-text">Updating specifications for: <strong>{{ meal.name }}</strong></p>

    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        
        <div class="edit-meal-actions">
            <button type="submit" class="ui-btn ui-btn-success">Save Structural Changes</button>
            <a href="{% url 'admin_panel' %}" class="ui-btn ui-btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
